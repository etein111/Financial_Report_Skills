# 提取规则 - 按报告类型分类

company:
  required_fields:
    - ticker
    - company_name
    - rating
    - target_price
    - report_date
    - title
    - analysts
    - contact_person
    - investment_thesis
    - certificate
  extraction_prompts:
    ticker: "提取股票代码，格式如 '700 HK' 或 'VRT US'"
    company_name: "提取公司全称"
    rating: "提取评级，如 'OUTPERFORM', 'NEUTRAL', 'UNDERPERFORM'"
