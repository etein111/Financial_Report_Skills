# 排版校验规则

validation_rules:
  - name: heading_sequence
    description: "标题序列检查"
    pattern: "^#{1,6}\\s"
    
  - name: table_border
    description: "表格边框检查"
    check: "表格应有清晰边框"
    
  - name: font_consistency
    description: "字体一致性"
    check: "正文应使用统一字体"
    
  - name: spacing
    description: "间距检查"
    check: "段落间应有适当间距"

placeholder_patterns:
  - "{{[a-z_]+}}"
  - "{%[a-z_]+%}"
