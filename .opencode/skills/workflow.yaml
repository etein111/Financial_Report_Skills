# 场景一: 模板制作与维护 工作流
name: template-maintenance-workflow
version: "1.0"

triggers:
  - event: user.upload_template
    description: "用户上传模板文件"

stages:
  - name: create_template
    skill: template-admin
    command: "设为{type}报告模板"
    on_success: validate
    
  - name: validate
    skill: template-admin
    command: "验证模板"
    on_success: complete
    
  - name: update_rule
    skill: rule-manager
    command: "{feedback}"
    triggers:
      - add_field
      - modify_field
      - delete_field

  - name: update_template
    skill: template-admin
    command: "更新模板"
    on_success: complete

responses:
  template_created: |
    模板创建成功！🎉
    
    检测到的占位符: {placeholders}
    
    下一步: 您可以通过对话方式修改提取规则，例如:
    "以后提取{type}报告时，增加一个'风险提示'字段"
  
  template_updated: |
    模板更新成功！✅
    
    新增占位符: {new_placeholders}
  
  field_added: |
    已增加字段: {field_name}
    
    {template_prompt}
