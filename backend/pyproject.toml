[project]
name = "backend"
version = "0.1.0"
description = "Neolyst 投资研究报告管理系统 - 后端服务"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "supabase>=2.7.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "email-validator>=2.3.0",
]

[tool.uv]
dev-dependencies = [
    "black>=24.0.0",
    "ruff>=0.8.0",
    "mypy>=1.0.0",
]
