[project]
name = "neolyst-backend"
version = "0.1.0"
description = "Neolyst auth and user management backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.9",
    "supabase>=2.10.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
