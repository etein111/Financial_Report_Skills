<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title or "Neolyst" }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    body {
      background:
        radial-gradient(80rem 40rem at 80% -10%, rgba(56, 189, 248, 0.22), transparent),
        radial-gradient(70rem 30rem at -10% 110%, rgba(16, 185, 129, 0.18), transparent),
        #020617;
    }
  </style>
</head>
<body class="min-h-screen text-slate-100">
  {% block content %}{% endblock %}
</body>
</html>
