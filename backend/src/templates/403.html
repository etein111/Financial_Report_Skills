{% extends "base.html" %}
{% block content %}
<main class="mx-auto flex min-h-screen max-w-3xl items-center justify-center px-6 py-10">
  <section class="w-full rounded-3xl border border-rose-500/30 bg-slate-900/80 p-10 text-center">
    <p class="text-sm uppercase tracking-[0.2em] text-rose-300">403</p>
    <h1 class="mt-3 text-4xl font-semibold">{{ message or "No permission" }}</h1>
    <p class="mt-4 text-sm text-slate-300">This page requires admin permission.</p>
    <a
      href="/desktop"
      class="mt-8 inline-flex rounded-xl border border-cyan-300 px-4 py-2 text-sm text-cyan-200 transition hover:bg-cyan-400/10"
    >
      Back to Desktop
    </a>
  </section>
</main>
{% endblock %}
