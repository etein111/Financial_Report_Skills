{% extends "base.html" %}
{% block content %}
<main class="mx-auto max-w-7xl px-6 py-8">
  <header class="mb-6">
    <p class="text-xs uppercase tracking-[0.22em] text-cyan-300">Admin Workspace</p>
    <h1 class="text-3xl font-semibold">Users</h1>
  </header>

  <section class="space-y-4 rounded-2xl border border-slate-700 bg-slate-900/70 p-5">
    <form
      class="grid gap-3 rounded-xl border border-slate-700 bg-slate-950/60 p-3 md:grid-cols-5"
      hx-post="/users/actions/create"
      hx-target="#users-table"
      hx-swap="innerHTML"
    >
      <input type="email" name="email" required placeholder="Email" class="rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-sm" />
      <input type="text" name="full_name" required placeholder="Full name" class="rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-sm" />
      <input type="password" name="password" required minlength="8" placeholder="Temp password" class="rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-sm" />
      <select name="role" class="rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-sm">
        <option value="analyst">analyst</option>
        <option value="sa">sa</option>
        <option value="admin">admin</option>
      </select>
      <button class="rounded-xl bg-emerald-400 px-4 py-2 text-sm font-semibold text-slate-950">Create User</button>
      <input type="hidden" name="q" value="" />
      <input type="hidden" name="page" value="1" />
    </form>

    <form
      id="users-search-form"
      class="grid gap-3 sm:grid-cols-[1fr_auto]"
      hx-get="/users/table"
      hx-target="#users-table"
      hx-swap="innerHTML"
    >
      <input
        type="text"
        name="q"
        placeholder="Search by name or email"
        class="rounded-xl border border-slate-700 bg-slate-950 px-4 py-2.5 text-sm outline-none ring-cyan-300 transition focus:ring"
      />
      <button class="rounded-xl bg-cyan-400 px-4 py-2.5 text-sm font-semibold text-slate-950">Search</button>
    </form>

    <div
      id="users-table"
      hx-get="/users/table"
      hx-trigger="load"
      hx-swap="innerHTML"
      class="min-h-[18rem]"
    ></div>
  </section>
</main>
{% endblock %}
