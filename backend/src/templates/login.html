{% extends "base.html" %}
{% block content %}
<main class="mx-auto flex min-h-screen max-w-6xl items-center justify-center px-6 py-10">
  <section class="grid w-full overflow-hidden rounded-3xl border border-slate-700/50 bg-slate-900/70 backdrop-blur md:grid-cols-2">
    <div class="relative hidden p-10 md:block">
      <div class="absolute inset-0 bg-[radial-gradient(circle_at_20%_20%,rgba(56,189,248,0.25),transparent_40%),radial-gradient(circle_at_80%_80%,rgba(16,185,129,0.2),transparent_45%)]"></div>
      <div class="relative space-y-6">
        <p class="text-xs uppercase tracking-[0.3em] text-cyan-300">Neolyst Platform</p>
        <h1 class="text-4xl font-semibold leading-tight">Auth and User Management</h1>
        <p class="max-w-md text-sm text-slate-300">
          Secure access with Supabase Auth, role control, and SSR management workspace.
        </p>
      </div>
    </div>
    <div class="space-y-6 p-8 md:p-10">
      <h2 class="text-2xl font-semibold">Login</h2>
      <form id="login-form" class="space-y-4">
        <label class="block text-sm">
          <span class="mb-1 block text-slate-300">Email</span>
          <input
            name="email"
            type="email"
            required
            class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-2.5 outline-none ring-cyan-300 transition focus:ring"
          />
        </label>
        <label class="block text-sm">
          <span class="mb-1 block text-slate-300">Password</span>
          <input
            name="password"
            type="password"
            required
            minlength="8"
            class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-2.5 outline-none ring-cyan-300 transition focus:ring"
          />
        </label>
        <button
          type="submit"
          class="w-full rounded-xl bg-cyan-400 px-4 py-2.5 font-semibold text-slate-950 transition hover:bg-cyan-300"
        >
          Sign In
        </button>
      </form>

      <form id="forgot-form" class="space-y-3 rounded-xl border border-slate-700/70 bg-slate-950/80 p-4">
        <p class="text-sm font-medium">Forgot password</p>
        <label class="block text-sm">
          <span class="mb-1 block text-slate-300">Email</span>
          <input
            name="email"
            type="email"
            required
            class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-2.5 outline-none ring-cyan-300 transition focus:ring"
          />
        </label>
        <button
          type="submit"
          class="w-full rounded-xl border border-cyan-300 px-4 py-2.5 font-medium text-cyan-200 transition hover:bg-cyan-400/10"
        >
          Send reset email
        </button>
      </form>

      <p id="message" class="min-h-6 text-sm text-cyan-200"></p>
    </div>
  </section>
</main>

<script>
  const message = document.getElementById("message");
  const loginForm = document.getElementById("login-form");
  const forgotForm = document.getElementById("forgot-form");

  loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    const formData = new FormData(loginForm);
    const payload = {
      email: formData.get("email"),
      password: formData.get("password"),
    };
    const resp = await fetch("/api/auth/login", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload),
    });
    const data = await resp.json();
    if (!resp.ok) {
      message.textContent = data.detail || "Login failed";
      return;
    }
    window.location.href = "/desktop";
  });

  forgotForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    const formData = new FormData(forgotForm);
    const payload = { email: formData.get("email") };
    const resp = await fetch("/api/auth/forgot-password", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload),
    });
    const data = await resp.json();
    message.textContent = data.message || "If the account exists, a reset email has been sent";
  });
</script>
{% endblock %}
