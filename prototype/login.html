<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neolyst - Login</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        zinc: {
                            950: '#09090b',
                            900: '#18181b',
                            800: '#27272a',
                            700: '#3f3f46',
                            500: '#71717a',
                            400: '#a1a1aa',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(to bottom, #0c1221 0%, #09090b 50%, #020617 100%);
            color: #ffffff;
            overflow: hidden;
        }

        /* Particle Background */
        .particle-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #0c1221 0%, #09090b 50%, #020617 100%);
        }

        /* Login Box */
        .login-box {
            background: #18181b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 40px;
            width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .login-input {
            width: 100%;
            padding: 12px;
            background: #09090b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: white;
            font-size: 14px;
            margin-bottom: 16px;
            transition: all 200ms;
        }

        .login-input:focus {
            outline: none;
            background: #27272a;
            border-color: rgba(255, 255, 255, 0.2);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(to bottom, #27272a, #3f3f46);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: all 200ms;
        }

        .login-btn:hover {
            background: linear-gradient(to bottom, #3f3f46, #52525b);
            border-color: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <!-- Login Page -->
    <div id="login-page">
        <canvas class="particle-bg" id="particleCanvas"></canvas>

        <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
            <div class="login-box">
                <div style="text-align: center; margin-bottom: 32px;">
                    <h1 style="font-size: 32px; font-weight: 600; color: rgba(255, 255, 255, 0.9); margin-bottom: 8px; white-space: nowrap;">
                        The Future is Now
                    </h1>
                    <p style="color: #71717a; font-size: 14px;">Research Report Management System</p>
                </div>

                <div style="margin-bottom: 24px;">
                    <label style="display: block; font-size: 13px; color: #a1a1aa; margin-bottom: 8px;">Email</label>
                    <input type="email" class="login-input" placeholder="admin@example.com" value="admin@example.com">
                </div>

                <div style="margin-bottom: 32px;">
                    <label style="display: block; font-size: 13px; color: #a1a1aa; margin-bottom: 8px;">Password</label>
                    <input type="password" class="login-input" placeholder="••••••••" value="password">
                </div>

                <button class="login-btn" onclick="window.location.href='index.html'">Login</button>
            </div>
        </div>
    </div>

    <script>
        // Particle Effect
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationId;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Mouse interaction removed

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.baseSize = Math.random() * 2 + 1;
                this.size = this.baseSize;
                this.baseOpacity = Math.random() * 0.4 + 0.3;
                this.opacity = this.baseOpacity;
                this.pulsePhase = Math.random() * Math.PI * 2;
                this.hue = Math.random() * 60 + 200;
            }

            update() {
                this.pulsePhase += 0.15;
                this.opacity = this.baseOpacity + Math.sin(this.pulsePhase) * 0.3;

                this.x += this.vx;
                this.y += this.vy;

                // Wrap around
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }

            draw() {
                const glowSize = this.size * 3;
                const gradient = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, glowSize
                );

                gradient.addColorStop(0, `hsla(${this.hue}, 70%, 50%, ${this.opacity})`);
                gradient.addColorStop(0.3, `hsla(${this.hue}, 70%, 50%, ${this.opacity * 0.7})`);
                gradient.addColorStop(1, `hsla(${this.hue}, 70%, 20%, 0)`);

                ctx.beginPath();
                ctx.arc(this.x, this.y, glowSize, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 120; i++) {
                particles.push(new Particle());
            }
        }

        function connectParticles() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 140) {
                        const opacity = (1 - distance / 140) * 0.3;

                        const gradient = ctx.createLinearGradient(
                            particles[i].x, particles[i].y,
                            particles[j].x, particles[j].y
                        );

                        gradient.addColorStop(0, `hsla(${particles[i].hue}, 70%, 60%, ${opacity})`);
                        gradient.addColorStop(1, `hsla(${particles[j].hue}, 70%, 60%, ${opacity})`);

                        ctx.beginPath();
                        ctx.strokeStyle = gradient;
                        ctx.lineWidth = 1.5;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            connectParticles();

            animationId = requestAnimationFrame(animate);
        }

        initParticles();
        animate();
    </script>
</body>
</html>
