<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neolyst - Desktop</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        zinc: {
                            950: '#09090b',
                            900: '#18181b',
                            800: '#27272a',
                            700: '#3f3f46',
                            500: '#71717a',
                            400: '#a1a1aa',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(to bottom, #0c1221 0%, #09090b 50%, #020617 100%);
            color: #ffffff;
            min-height: 100vh;
        }

        .desktop {
            width: 100%;
            min-height: 100vh;
            background: linear-gradient(to bottom, #0c1221 0%, #09090b 50%, #020617 100%);
            padding: 40px;
        }

        .desktop-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 24px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-name {
            font-size: 14px;
            color: #a1a1aa;
        }

        .logout-btn {
            padding: 8px 16px;
            background: #27272a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: white;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            transition: all 200ms;
        }

        .logout-btn:hover {
            background: #3f3f46;
            border-color: rgba(255, 255, 255, 0.2);
        }

        .desktop-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card-group {
            margin-bottom: 40px;
        }

        .card-group-title {
            font-size: 13px;
            color: #71717a;
            margin-bottom: 16px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .desktop-card {
            background: #18181b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 16px;
            cursor: pointer;
            transition: all 200ms ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            aspect-ratio: 4/3;
            text-decoration: none;
            color: inherit;
        }

        .desktop-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.05);
            transform: translateY(-2px);
        }

        .desktop-card-icon {
            font-size: 40px;
        }

        .desktop-card-title {
            font-size: 14px;
            font-weight: 500;
            color: #ffffff;
        }

        .desktop-card-desc {
            font-size: 12px;
            color: #71717a;
        }
    </style>
</head>
<body>
    <!-- Desktop -->
    <div class="desktop">
        <!-- Header -->
        <div class="desktop-header">
            <div class="logo">Neolyst</div>
            <div class="user-info">
                <span class="user-name">Welcome, Admin</span>
                <a href="login.html" class="logout-btn">Logout</a>
            </div>
        </div>

        <!-- Cards Grid -->
        <div class="desktop-grid">
            <!-- Report Functions Group -->
            <div class="card-group" style="grid-column: 1 / -1;">
                <div class="card-group-title">Reports</div>
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;">
                    <a href="reports.html" target="_blank" class="desktop-card">
                        <div class="desktop-card-icon">📝</div>
                        <div class="desktop-card-title">Reports</div>
                        <div class="desktop-card-desc">View all reports</div>
                    </a>

                    <a href="new-report.html" target="_blank" class="desktop-card">
                        <div class="desktop-card-icon">➕</div>
                        <div class="desktop-card-title">New Report</div>
                        <div class="desktop-card-desc">Create new report</div>
                    </a>

                    <a href="templates.html" target="_blank" class="desktop-card">
                        <div class="desktop-card-icon">📄</div>
                        <div class="desktop-card-title">Templates</div>
                        <div class="desktop-card-desc">Report templates (Word/Excel)</div>
                    </a>
                </div>
            </div>

            <!-- Data Management Group -->
            <div class="card-group" style="grid-column: 1 / -1;">
                <div class="card-group-title">Data Management</div>
                <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;">
                    <a href="analysts.html" target="_blank" class="desktop-card">
                        <div class="desktop-card-icon">👤</div>
                        <div class="desktop-card-title">Analysts</div>
                        <div class="desktop-card-desc">Analyst management</div>
                    </a>

                    <a href="coverage.html" target="_blank" class="desktop-card">
                        <div class="desktop-card-icon">🏢</div>
                        <div class="desktop-card-title">Coverage</div>
                        <div class="desktop-card-desc">Company coverage</div>
                    </a>

                    <a href="sectors.html" target="_blank" class="desktop-card">
                        <div class="desktop-card-icon">🏗️</div>
                        <div class="desktop-card-title">Sectors</div>
                        <div class="desktop-card-desc">Industry classification</div>
                    </a>

                    <a href="regions.html" target="_blank" class="desktop-card">
                        <div class="desktop-card-icon">🌍</div>
                        <div class="desktop-card-title">Regions</div>
                        <div class="desktop-card-desc">Region management</div>
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
