<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Report - Neolyst</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        zinc: { 950: '#09090b', 900: '#18181b', 800: '#27272a', 500: '#71717a', 400: '#a1a1aa' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #09090b; color: #ffffff; min-height: 100vh; }
        .page-header { background: #18181b; border-bottom: 1px solid rgba(255,255,255,0.1); padding: 16px 24px; display: flex; align-items: center; }
        .page-title { font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .content { padding: 24px; max-width: 800px; margin: 0 auto; }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 13px; color: #a1a1aa; margin-bottom: 8px; }
        .form-input, .form-select { width: 100%; padding: 12px; background: #09090b; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: white; font-size: 14px; }
        .form-input:focus, .form-select:focus { outline: none; background: #27272a; border-color: rgba(255,255,255,0.2); }
        .upload-area { border: 2px dashed rgba(255,255,255,0.1); background: rgba(39,39,42,0.3); border-radius: 6px; padding: 40px; text-align: center; cursor: pointer; transition: all 200ms; }
        .upload-area:hover { border-color: rgba(255,255,255,0.2); background: rgba(39,39,42,0.5); }
        .btn-group { display: flex; gap: 8px; margin-top: 24px; }
        .btn { padding: 12px 24px; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 200ms; border: 1px solid rgba(255,255,255,0.1); }
        .btn-primary { background: linear-gradient(to bottom, #27272a, #3f3f46); color: white; }
        .btn-primary:hover { background: linear-gradient(to bottom, #3f3f46, #52525b); }
        .btn-secondary { background: #27272a; color: #a1a1aa; }
        .btn-secondary:hover { background: #3f3f46; color: white; }
    </style>
</head>
<body>
    <div class="page-header">
        <div class="page-title"><span>➕</span><span>New Report</span></div>
    </div>

    <div class="content">
        <form onsubmit="return false;">
            <div class="form-group">
                <label class="form-label">Report Type *</label>
                <select class="form-select">
                    <option>Company</option>
                    <option>Sector</option>
                    <option>Company Flash</option>
                    <option>Sector Flash</option>
                    <option>Macro/Strategy</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Report Title *</label>
                <input type="text" class="form-input" placeholder="Enter report title">
            </div>

            <div class="form-group">
                <label class="form-label">Analysts * (Select multiple)</label>
                <select class="form-select" multiple style="height: 100px;">
                    <option>John Doe</option>
                    <option>Jane Smith</option>
                    <option>Mike Johnson</option>
                    <option>Sarah Williams</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Report File (Word) *</label>
                <div class="upload-area">
                    <div style="font-size: 40px; margin-bottom: 12px;">📄</div>
                    <div style="font-size: 14px; color: #a1a1aa;">Drag & drop or click to upload</div>
                    <div style="font-size: 12px; color: #71717a; margin-top: 4px;">Supports .docx, .doc</div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Excel Model File</label>
                <div class="upload-area">
                    <div style="font-size: 40px; margin-bottom: 12px;">📊</div>
                    <div style="font-size: 14px; color: #a1a1aa;">Drag & drop or click to upload</div>
                    <div style="font-size: 12px; color: #71717a; margin-top: 4px;">Supports .xlsx, .xls</div>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn btn-secondary">Cancel</button>
                <button class="btn btn-secondary">Save Draft</button>
                <button class="btn btn-primary">Publish</button>
            </div>
        </form>
    </div>
</body>
</html>
