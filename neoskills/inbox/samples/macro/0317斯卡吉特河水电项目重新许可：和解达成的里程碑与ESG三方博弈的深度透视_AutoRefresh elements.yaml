title_ch: '斯卡吉特河水电项目重新许可：和解达成的里程碑与ESG三方博弈的深度透视'
title_en: 'Skagit River Hydropower Project Re-licensing: A Milestone in the Settlement and an In-Depth Perspective on the Complicated ESG Considerations'
summary: 'Seattle City Light (SCL) secured a $3.8 billion settlement to relicense the Skagit River Hydroelectric Project, critical for 20% of the city’s power and carbon goals. This cost, covering fish protection, tribal compensation, and habitat restoration, will be passed to consumers via rate hikes. The deal marks a structural shift in utility valuation: hydropower is transitioning from a low-cost energy source to a high-compliance asset. With nearly one-third of spending dedicated to regulatory and social obligations rather than generation capacity, levelized energy costs face upward pressure. While securing long-term operational certainty amidst surging AI demand, the "Skagit standard" signals that future hydropower investments must account for massive environmental liabilities. Investors should now view such assets as "environmental compliance operators," where relicensing costs, not just generation potential, define intrinsic value and risk profiles globally.'