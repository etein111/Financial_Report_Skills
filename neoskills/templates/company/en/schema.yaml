abstract:
  description: 报告摘要部分
  hints:
  - 通常包含投资亮点、核心观点
  - 长度约 200-500 字
  - 不应包含表格和图表
  - 位于首页右侧区域
  scope: 首页右侧
  type: fragment
appendix:
  description: 法律披露附录（IMPORTANT DISCLOSURES）
  hints:
  - 一定从新的一页开始（通过分节符隔离）
  - 包含重要信息披露内容
  - 通常有"附录APPENDIX"标题
  scope: 正文之后，报告末尾
  type: fragment
body:
  description: 报告正文部分
  hints:
  - 包含各章节详细内容
  - 可能包含表格、图表引用
  - 按原文结构保留段落和标题层级
  scope: 第二页开始
  type: fragment
