relative_chart:
  description: 相对收益对比图
  format: 自动生成
  hints:
  - 基于 yfinance 数据自动绘制
  - 比较股票 vs 恒生指数(HSI) 1年相对收益
  - 颜色：#1f77b4（蓝色）
  - 验证：需检查 relative_chart_generated 状态为 true

recommendation_chart:
  description: 推荐走势/目标价图
  format: 自动生成
  hints:
  - 基于 yfinance 数据自动绘制
  - 显示评级、当前价、目标价、潜在涨幅
  - 颜色：绿色(买入)、橙色(持有)、红色(卖出)
  - 验证：需检查 recommendation_chart_generated 状态为 true

