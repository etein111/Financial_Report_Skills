title_ch: '周报(03/16-03/19): 消费板块：港股消费震荡，油价高企压制风险偏好；海外互联网板块：腾讯年报落地，AI长期逻辑未变'
title_en: 'HK consumption rebounds amid volatility, elevated oil prices weigh on risk appetite; Overseas internet sector: Tencent FY2025 results released, long-term AI thesis continues to strengthen'
appendix:
  summary: 'Overseas consumption: Rebounding amid Volatility, Elevated Oil Prices Weigh on Risk Appetite
    Hong Kong consumption: The sector rebounded this week, outperforming the broader market. Despite oil prices remaining above $100 and ongoing Strait of Hormuz shipping disruptions, prior oversold conditions drove a technical recovery, supported by structural southbound capital inflows. Valuations remain at historically low levels (931454 P/E2 at 25.59x), offering a margin of safety. Looking into 2026, we expect a structural recovery driven by policy support and domestic demand improvement; favor high-end dining, sportswear, and stocks benefiting from “trade-in” programs.
    U.S. consumption: The sector came under broad pressure, with both staples and discretionary names declining. SPLRCS fell 2.83% while discretionary is down 7.57% YTD. Oil above $100 continues to fuel inflationary concerns, but the Fed’s March FOMC held rates at 3.50–3.75% while maintaining two projected cuts, read as dovish, potentially easing medium-term valuation pressure.
    Overseas internet: Tencent FY2025 Results Released, FOMC Dovish Signal Supports Tech
    Hong Kong internet: The Hang Seng Tech Index extended its rebound, up 1.24% cumulatively, though individual stock divergence was sharp. Tencent released FY2025 results on March 18 (revenue +14% YoY, Non-IFRS operating profit +18%), but capex of RMB 79.2bn fell below expectations, and guidance to at least double AI product spending weighed on near-term outlook, sending shares down 5.72% on March 19. Meituan (+6.78%) and Xiaomi (+9.18%) outperformed. Southbound flows were volatile: net selling of HKD 12.5bn and 114.8bn on March 16–17, turning to net buying of HKD 12.17bn on March 18.
    U.S. internet: Tech stocks oscillated higher then lower. As of March 18, Nasdaq was up 0.21%, S&P 500 down 0.11%, Dow down 0.72%. Two catalysts dominated: the Fed’s dovish FOMC hold with dot plot still pointing to two 2026 cuts (markets now pricing three, starting June); and Nvidia’s GTC unveiling next-gen AI platforms. The AI industry continues evolving from exuberance toward scalable deployment. We recommend buying dips into tech leaders with cloud infrastructure, data advantages, and closed-loop use cases.
    General aviation: Steady global delivery growth
    Global general aviation deliveries reached 3,230 units in 2025 (+3.3%), expected to rise to 3,410 in 2026. Business jet deliveries grew +11.8%, driving total delivery value to a record $31.0 billion. North America leads growth; Cirrus continues gaining share with 37.2% in piston aircraft.
    Investment recommendations
    Short-term markets are in a corrective phase amid geopolitical tensions and elevated oil, but long-term fundamentals remain intact. The Fed’s dovish FOMC and Tencent’s results validating AI commercialization reinforce medium-to-long-term allocation value. In consumption, focus on leaders with brand moats and overseas capabilities—e.g., L’Oreal, Ulta Beauty, Costco, P&G. In internet/tech, stay constructive on AI’s transition to commercial scalability; focus on Tencent, Alibaba, Microsoft, Amazon, and Alphabet. In general aviation, favor high-end manufacturing leaders with expanding market share.'